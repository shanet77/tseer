name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on:
      - linux-amd64
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          repo_host="${GITHUB_SERVER_URL#https://}"
          repo_url="https://${repo_host}/${GITHUB_REPOSITORY}.git"
          if [ ! -d .git ]; then
            git init
            git remote add origin "${repo_url}"
          else
            git remote set-url origin "${repo_url}"
          fi
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          node --version
          pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          pnpm build

      - name: Test
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          pnpm test

  build_and_push:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on:
      - linux-amd64
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          repo_host="${GITHUB_SERVER_URL#https://}"
          repo_url="https://${repo_host}/${GITHUB_REPOSITORY}.git"
          if [ ! -d .git ]; then
            git init
            git remote add origin "${repo_url}"
          else
            git remote set-url origin "${repo_url}"
          fi
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          # The runner may reuse the workspace across runs; drop untracked and
          # gitignored leftovers so they never leak into the image (the
          # Containerfile does `COPY . .`).
          git clean -fdx

      - name: Build and push image to zot
        env:
          IMAGE_BASE: ${{ secrets.IMAGE_BASE }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          # IMAGE_BASE is registry + namespace (e.g. zot.shanenet.xyz/shane);
          # the repository name is appended here. Using the secret as the full
          # image reference pushed every build to the namespace repo instead of
          # this one, so deploys silently no-op'd while still reporting success.
          IMAGE="${IMAGE_BASE}/tseer"
          echo "Building tseer (${GITHUB_SHA}) -> ${IMAGE}"
          # The Containerfile builds the pnpm workspace inside the container
          # (FROM node:26-slim), so the runner host needs only podman. zot
          # accepts anonymous push/pull — no login needed.
          podman build \
            --platform linux/amd64 \
            --file Containerfile \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            .
          podman push "${IMAGE}:${GITHUB_SHA}"
          podman push "${IMAGE}:latest"
          echo "=== pushed: ${IMAGE}:${GITHUB_SHA} + ${IMAGE}:latest ==="
